name: quant-notifier
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for new quant listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python quant_notifier.py
      - name: Save seen ids
        run: |
          git config user.name "notifier"
          git config user.email "notifier@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "update seen ids" && git push
